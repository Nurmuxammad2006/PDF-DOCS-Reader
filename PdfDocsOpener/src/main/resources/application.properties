spring.application.name=PdfDocsOpener
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Create required tables before Hibernate validates the schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/manual/add_telegram_user_preferences.sql

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Max file size settings
spring.servlet.multipart.max-file-size=${storage.max-size:50MB}
spring.servlet.multipart.max-request-size=${storage.max-size:50MB}

# Telegram bot settings and token
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=pdf_docs_reader_bot
telegram.bot.webhook-url=${TELEGRAM_WEBHOOK_URL:}

storage.upload-dir=${UPLOAD_DIR:uploads}
storage.max-size=${MAX_FILE_SIZE_BYTES:52428800}
storage.default-quota=${DEFAULT_QUOTA_BYTES:1073741824}

admin.jwt-secret=${ADMIN_JWT_SECRET:}
admin.token-ttl-seconds=${ADMIN_TOKEN_TTL_SECONDS:3600}
